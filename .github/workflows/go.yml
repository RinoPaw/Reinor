name: Go
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Gateway (Linux)
        run: go build -o /tmp/reinor-gateway ./cmd/gateway
      - name: Build Agent (Windows)
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/reinor-agent.exe ./cmd/agent
      - name: Build Agent (Linux)
        run: GOOS=linux GOARCH=amd64 go build -o /tmp/reinor-agent-linux ./cmd/agent
      - name: Check Linux updater syntax
        run: |
          bash -n deploy/update-gateway.sh
          bash tests/update-gateway.sh

  validate-windows-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell update staging tests
        shell: pwsh
        run: ./tests/update-agent.ps1

  manual-build:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, validate-windows-update]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build staged Windows Agent and Linux Gateway
        shell: bash
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/rinomesh-agent-join.exe ./cmd/agent
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/rinomesh-gateway ./cmd/gateway
          cd dist
          sha256sum rinomesh-agent-join.exe rinomesh-gateway > SHA256SUMS
      - name: Upload staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reinor-manual-update-${{ github.sha }}
          path: dist/
          retention-days: 7

  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"
      - name: Build Android ARM64 Agent with bionic DNS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          export GOOS=android GOARCH=arm64 CGO_ENABLED=1
          export CC="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          go build -trimpath -o dist/reinor-agent-android-arm64 ./cmd/agent
          file dist/reinor-agent-android-arm64
          cd dist
          sha256sum reinor-agent-android-arm64 > SHA256SUMS
      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: reinor-android-arm64-${{ github.sha }}
          path: dist/
          retention-days: 7
