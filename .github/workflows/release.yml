name: Release
on:
  push:
    tags: ['v0.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;28.2.13676358
          accept-android-sdk-licenses: true
      - name: Build current platforms
        run: |
          set -eu
          mkdir -p dist
          export CGO_ENABLED=0
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/reinor-windows-amd64.exe ./cmd/agent
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/reinor-linux-amd64 ./cmd/agent
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/reinor-darwin-amd64 ./cmd/agent
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/reinor-darwin-arm64 ./cmd/agent
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" go build -trimpath -ldflags='-s -w' -o dist/reinor-android-arm64 ./cmd/agent
      - uses: actions/checkout@v4
        with:
          ref: e2b363428810ee78bb8a239ab1e37ba0b2f025a0
          path: win7-source
      - uses: actions/setup-go@v6
        with:
          go-version: '1.20.14'
          cache-dependency-path: win7-source/go.win7.sum
      - name: Build Windows 7
        working-directory: win7-source
        run: |
          go test -modfile=go.win7.mod ./cmd/agent ./internal/wire
          go vet -modfile=go.win7.mod ./cmd/agent ./internal/wire
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 GOAMD64=v1 go build -modfile=go.win7.mod -trimpath -ldflags='-s -w' -o ../dist/reinor-win7-amd64.exe ./cmd/agent
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -modfile=go.win7.mod -trimpath -ldflags='-s -w' -o ../dist/reinor-win7-386.exe ./cmd/agent
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          files=(reinor-windows-amd64.exe reinor-win7-amd64.exe reinor-win7-386.exe reinor-linux-amd64 reinor-darwin-amd64 reinor-darwin-arm64 reinor-android-arm64)
          sha256sum "${files[@]}" > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          ## Windows
          - `reinor-windows-amd64.exe`: Windows 10/11 x64
          - `reinor-win7-amd64.exe`: Windows 7 x64
          - `reinor-win7-386.exe`: Windows 7 x86

          ## Linux
          - `reinor-linux-amd64`: Linux x86-64

          ## macOS
          - `reinor-darwin-amd64`: Intel Mac
          - `reinor-darwin-arm64`: Apple Silicon Mac

          ## Android
          - `reinor-android-arm64`: Android ARM64 (Termux)

          All binaries are built in GitHub Actions with stripped debug information. Windows 7 uses Go 1.20.14 and compatibility revision `e2b3634`; other builds use the tagged source. Verify with `SHA256SUMS`.
          NOTES
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md "${extra[@]}"
